
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090909">
<title>J.A.R.V.I.S. AI</title>
  <link rel="manifest" href="./manifest.json">
<style>
:root {
  color-scheme: dark;
  --bg: #090909;
  --panel: #14130f;
  --gold: #d9b568;
  --light: #f5d99b;
  --text: #f4f0e8;
  --muted: #969087;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 15px system-ui, sans-serif;
}
button, textarea, select, input { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, textarea:focus-visible {
  outline: 2px solid var(--gold); outline-offset: 3px;
}
.app {
  height: 100dvh; min-height: 450px; max-width: 820px;
  margin: auto; display: flex; flex-direction: column;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% -15%,#302719,#11100d 42%,#090909 78%);
}
.top {
  display: flex; justify-content: space-between; align-items: center;
  padding: calc(12px + env(safe-area-inset-top)) 16px;
  border-bottom: 1px solid #29251c;
}
.brand { display:flex; align-items:center; gap:10px; }
.logo {
  width:38px; height:38px; border:1px solid var(--gold);
  border-radius:50%; display:grid; place-items:center;
  color:var(--light); box-shadow:0 0 16px #d9b56830;
  font-weight:bold; animation: glow 3s ease-in-out infinite;
}
.brand b { letter-spacing:2px; font-size:14px; }
.brand small { display:block; color:var(--muted); font-size:10px; }
.online { font-size:10px; color:var(--gold); }
.hero {
  display:flex; align-items:center; justify-content:center;
  gap:15px; padding:15px 10px;
}
.reactor {
  width:76px; height:76px; flex-shrink:0; position:relative;
  display:grid; place-items:center; border:1px solid #a98743;
  border-radius:50%;
  background:radial-gradient(circle,#5b4827,#201b11 52%,#090909);
  box-shadow:0 0 25px #d9b56825;
  transition:box-shadow .3s, transform .3s;
}
.reactor:before, .reactor:after {
  content:""; position:absolute; inset:6px; border:1px solid #c3a15c80;
  border-radius:50%;
}
.reactor:after {
  inset:13px; border-style:dashed;
  animation:spin 18s linear infinite;
}
.core {
  width:25px; height:25px; border-radius:50%;
  background:radial-gradient(circle,#fff4c7,#e8c36b 45%,#a47727);
  box-shadow:0 0 18px #f3ce78a0;
}
.hero h1 { font-size:19px; margin:5px 0; letter-spacing:1px; }
.hero p { font-size:11px; color:var(--muted); margin:0; }
.eyebrow { font-size:9px; letter-spacing:2px; color:var(--gold); }
.thinking .reactor {
  box-shadow:0 0 38px #d9b56875; transform:scale(1.04);
}
.thinking .core, .listening .core { animation:pulse .55s infinite alternate; }
.listening .reactor { box-shadow:0 0 35px #d9b56885; }
@keyframes spin { to { transform:rotate(360deg); } }
@keyframes pulse { to { transform:scale(1.3); opacity:.65; } }
@keyframes glow {
  50% { box-shadow:0 0 23px #d9b56865; }
}
.chat {
  flex:1; min-height:0; overflow-y:auto;
  padding:14px 16px 20px; display:flex; flex-direction:column; gap:17px;
  scroll-behavior:smooth; overscroll-behavior:contain;
}
.welcome { text-align:center; margin:auto 0; padding:15px 5px; }
.welcome h2 { font-size:21px; font-weight:500; }
.welcome p { font-size:13px; color:var(--muted); line-height:1.6; }
.suggestions {
  display:flex; gap:8px; flex-wrap:wrap; justify-content:center; margin-top:18px;
}
.suggestion {
  background:#17150f; color:#d6c6a4; border:1px solid #393123;
  border-radius:20px; padding:9px 12px; font-size:12px;
  transition:background .2s, transform .2s, border-color .2s;
}
.message {
  max-width:94%; white-space:pre-wrap; overflow-wrap:anywhere;
  line-height:1.65; animation:appear .22s ease both;
}
.user {
  align-self:flex-end; background:#292317; border:1px solid #403522;
  padding:11px 14px; border-radius:18px 18px 5px 18px;
}
.assistant { align-self:flex-start; padding:3px 2px 8px; width:100%; }
.label {
  font-size:10px; color:var(--gold); letter-spacing:2px;
  margin-bottom:7px; font-weight:bold;
}
.message-text { font-size:14px; overflow-wrap:anywhere; }
.message-text pre {
  white-space:pre-wrap; overflow-wrap:anywhere; overflow-x:auto;
  background:#151515; border:1px solid #383226;
  border-radius:10px; padding:10px;
}
.message-text a { color:var(--light); }
.typing { display:flex; gap:5px; padding:8px; }
.typing span {
  width:5px; height:5px; border-radius:50%;
  background:var(--gold); animation:pulse .6s infinite alternate;
}
.typing span:nth-child(2) { animation-delay:.2s; }
.typing span:nth-child(3) { animation-delay:.4s; }
@keyframes appear {
  from { opacity:0; transform:translateY(7px); }
  to { opacity:1; transform:translateY(0); }
}
.status { font-size:10px; color:var(--muted); padding:5px 16px 8px; }
.composer-wrap {
  padding:9px 12px calc(10px + env(safe-area-inset-bottom));
  border-top:1px solid #29251c; background:#0c0c0b;
}
.composer {
  display:flex; align-items:flex-end; gap:7px; padding:7px;
  border:1px solid #48402e; border-radius:24px; background:#171611;
  transition:border-color .2s, box-shadow .2s;
}
.composer:focus-within {
  border-color:var(--gold); box-shadow:0 0 15px #d9b56812;
}
#message {
  flex:1; min-width:0; max-height:110px; resize:none;
  background:transparent; border:0; outline:0; color:var(--text);
  padding:10px 4px; font-size:14px;
}
#message::placeholder { color:#817b6c; }
.btn {
  width:39px; height:39px; flex-shrink:0; border-radius:50%;
  border:1px solid #403a2b; background:#242117; color:var(--light);
  font-size:17px; transition:transform .15s, background .2s, opacity .2s;
}
.send { background:var(--gold); color:#171107; font-size:22px; font-weight:bold; }
.actions { display:flex; justify-content:center; gap:12px; padding-top:9px; }
.action {
  border:0; background:transparent; color:#aaa090;
  font-size:11px; padding:6px; border-radius:8px;
  transition:background .2s, color .2s;
}
button:active { transform:scale(.94); }
button:disabled { opacity:.45; }
.settings { display:none; padding:12px 16px; background:#10100e; }
.settings.open { display:block; animation:appear .2s ease; }
.settings label { display:block; font-size:11px; color:var(--muted); margin:8px 0; }
.settings select, .settings input {
  width:100%; padding:8px; background:#090909; color:white;
  border:1px solid #393326; border-radius:8px;
}
@media(min-width:600px) {
  .app { border-inline:1px solid #29251c; }
  .chat { padding-inline:28px; }
}
@media(prefers-reduced-motion:reduce) {
  *, *:before, *:after { animation:none!important; scroll-behavior:auto!important; }
}
</style>
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand">
      <div class="logo">J</div>
      <div><b>J.A.R.V.I.S.</b><small>ASSISTENTE PESSOAL</small></div>
    </div>
    <div class="online" id="online">● ONLINE</div>
  </header>

  <section class="hero">
    <div class="reactor"><div class="core"></div></div>
    <div>
      <div class="eyebrow">INTELIGÊNCIA ARTIFICIAL</div>
      <h1>À sua disposição.</h1>
      <p id="heroStatus">Pronto para conversar</p>
    </div>
  </section>

  <section class="chat" id="chat" aria-live="polite">
    <div class="welcome" id="welcome">
      <div style="color:var(--gold);font-size:28px">✧</div>
      <h2>Como posso ajudar?</h2>
      <p>Converse comigo, faça perguntas ou peça ajuda com alguma tarefa.</p>
      <div class="suggestions">
        <button class="suggestion" data-prompt="Me conte uma curiosidade interessante.">Uma curiosidade</button>
        <button class="suggestion" data-prompt="Me ajude a organizar meus estudos.">Organizar estudos</button>
        <button class="suggestion" data-prompt="Explique como funciona a inteligência artificial.">Explicar algo</button>
      </div>
    </div>
  </section>

  <div class="status" id="status">Sistema pronto</div>

  <section class="settings" id="settings">
    <label for="voice">Voz do dispositivo</label>
    <select id="voice"></select>
    <label for="rate">Velocidade da fala</label>
    <input id="rate" type="range" min=".7" max="1.25" step=".05" value=".95">
  </section>

  <footer class="composer-wrap">
    <form class="composer" id="form">
      <button class="btn" type="button" id="mic" aria-label="Microfone">🎙</button>
      <textarea id="message" rows="1" placeholder="Mensagem para o Jarvis..." required></textarea>
      <button class="btn send" type="submit" id="send" aria-label="Enviar">↑</button>
    </form>
    <div class="actions">
      <button class="action" id="newChat">Nova conversa</button>
      <button class="action" id="voiceToggle">Voz: ligada</button>
      <button class="action" id="settingsToggle">Configurações</button>
    </div>
  </footer>
</div>

<script>
(() => {
"use strict";

/* O Worker existente permanece igual. */
const API = "https://jarvis-cerebro.danielmoraissoares2.workers.dev/";
const $ = id => document.getElementById(id);
const app = $("app"), chat = $("chat"), input = $("message");

let history = [];
let busy = false;
let recognition = null;
let voiceEnabled = true;

function status(text, mode = "") {
  $("status").textContent = text;
  $("heroStatus").textContent = text;
  app.classList.remove("thinking", "listening");
  if (mode) app.classList.add(mode);
  $("online").textContent = mode === "thinking" ? "● PROCESSANDO" :
    mode === "listening" ? "● OUVINDO" : "● ONLINE";
}

function bottom() {
  chat.scrollTop = chat.scrollHeight;
}

function save() {
  try {
    localStorage.setItem("jarvis-history-v1", JSON.stringify(
      [...chat.querySelectorAll(".message")].map(el => ({
        role: el.classList.contains("user") ? "user" : "assistant",
        content: el.dataset.raw || el.innerText
      })).slice(-80)
    ));
  } catch (e) {}
}

function renderText(text, box) {
  let code = false, buffer = "", lines = [];

  function flush() {
    if (!lines.length) return;
    const div = document.createElement("div");
    div.textContent = lines.join("\n");
    div.style.marginBottom = "8px";
    box.appendChild(div);
    lines = [];
  }

  for (const line of String(text).split("\n")) {
    if (line.trim().startsWith("```")) {
      flush();
      if (code) {
        const pre = document.createElement("pre");
        pre.textContent = buffer;
        box.appendChild(pre);
        buffer = "";
        code = false;
      } else {
        code = true;
      }
    } else if (code) {
      buffer += line + "\n";
    } else {
      lines.push(line);
    }
  }

  flush();
  if (code) {
    const pre = document.createElement("pre");
    pre.textContent = buffer;
    box.appendChild(pre);
  }
}

function addMessage(role, text, persist = true) {
  $("welcome")?.remove();

  const el = document.createElement("article");
  el.className = "message " + (role === "user" ? "user" : "assistant");
  el.dataset.raw = text;

  if (role !== "user") {
    const label = document.createElement("div");
    label.className = "label";
    label.textContent = "J.A.R.V.I.S.";
    el.appendChild(label);
  }

  const box = document.createElement("div");
  box.className = "message-text";
  renderText(text, box);
  el.appendChild(box);
  chat.appendChild(el);
  bottom();
  if (persist) save();
  return el;
}

function showTyping() {
  $("welcome")?.remove();

  const el = document.createElement("article");
  el.className = "message assistant";
  el.id = "typing";

  const label = document.createElement("div");
  label.className = "label";
  label.textContent = "J.A.R.V.I.S.";

  const dots = document.createElement("div");
  dots.className = "typing";
  for (let i = 0; i < 3; i++) dots.appendChild(document.createElement("span"));

  el.append(label, dots);
  chat.appendChild(el);
  bottom();
  return el;
}

function speak(text) {
  if (!voiceEnabled || !("speechSynthesis" in window)) return;

  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = "pt-BR";
  utterance.rate = Number($("rate").value);

  const voices = speechSynthesis.getVoices();
  const selected = voices[Number($("voice").value)];
  if (selected) utterance.voice = selected;

  utterance.onstart = () => status("Jarvis falando");
  utterance.onend = () => status("Sistema pronto");
  utterance.onerror = () => status("Sistema pronto");
  speechSynthesis.speak(utterance);
}

function refreshVoices() {
  if (!("speechSynthesis" in window)) return;

  const select = $("voice");
  const old = select.value;
  const all = speechSynthesis.getVoices();
  select.innerHTML = "";

  const portuguese = all.map((voice, index) => ({voice, index}))
    .filter(item => item.voice.lang.toLowerCase().startsWith("pt"));
  const list = portuguese.length ? portuguese :
    all.map((voice, index) => ({voice, index}));

  list.forEach(item => {
    select.add(new Option(
      item.voice.name + " (" + item.voice.lang + ")",
      String(item.index)
    ));
  });

  if (!list.length) select.add(new Option("Voz padrão", ""));
  if ([...select.options].some(option => option.value === old)) {
    select.value = old;
  }
}

if ("speechSynthesis" in window) {
  refreshVoices();
  speechSynthesis.onvoiceschanged = refreshVoices;
}

function openPage(url) {
  window.open(url, "_blank", "noopener,noreferrer");
}

function localReply(text) {
  addMessage("assistant", text);
  status("Resposta pronta");
  speak(text);
}

async function askAI(message) {
  const waiting = showTyping();
  status("Pensando...", "thinking");
  busy = true;
  $("send").disabled = true;
  $("mic").disabled = true;

  try {
    const response = await fetch(API, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        message,
        history: history.slice(-10)
      })
    });

    const data = await response.json();
    if (!response.ok || !data.reply) throw new Error("Falha na conexão");

    waiting.remove();
    addMessage("assistant", data.reply);

    history.push(
      {role: "user", content: message},
      {role: "assistant", content: data.reply}
    );
    history = history.slice(-20);
    save();

    status("Resposta recebida");
    speak(data.reply);
  } catch (error) {
    waiting.remove();
    addMessage("assistant",
      "Não consegui conectar à IA agora. Confira sua internet e tente novamente.");
    status("Falha na conexão");
  } finally {
    busy = false;
    $("send").disabled = false;
    $("mic").disabled = false;
    input.focus();
  }
}

async function handleMessage(raw) {
  const text = raw.trim();
  if (!text || busy) return;

  addMessage("user", text);
  input.value = "";
  input.style.height = "auto";

  const normalized = text.toLocaleLowerCase("pt-BR");

  if (/\b(que horas|hora agora|horas são)\b/.test(normalized)) {
    localReply("Agora são " +
      new Date().toLocaleTimeString("pt-BR", {
        hour: "2-digit", minute: "2-digit"
      }) + ".");
    return;
  }

  if (/\b(que dia|data de hoje|data é hoje)\b/.test(normalized)) {
    localReply("Hoje é " +
      new Date().toLocaleDateString("pt-BR", {
        weekday: "long", day: "numeric",
        month: "long", year: "numeric"
      }) + ".");
    return;
  }

  if (/\b(pesquisar|pesquisa|procure|buscar|busque)\b/.test(normalized)) {
    const query = text.replace(
      /^(jarvis[, ]*)?(pesquisar|pesquisa|procure|buscar|busque)( por| sobre)?/i,
      ""
    ).trim();

    if (!query) {
      localReply("Diga o que devo pesquisar.");
      return;
    }

    localReply("Abrindo a pesquisa sobre " + query + ".");
    openPage("https://www.google.com/search?q=" + encodeURIComponent(query));
    return;
  }

  if (/\b(abrir|abre)\b/.test(normalized)) {
    let url = "";

    if (normalized.includes("youtube")) url = "https://m.youtube.com";
    else if (normalized.includes("google")) url = "https://www.google.com";
    else if (normalized.includes("wikipedia")) url = "https://pt.wikipedia.org";
    else if (normalized.includes("spotify")) url = "https://open.spotify.com";
    else if (normalized.includes("whatsapp")) url = "https://web.whatsapp.com";

    if (url) {
      localReply("Abrindo a página solicitada.");
      openPage(url);
      return;
    }
  }

  if (/\b(parar voz|pare de falar|silêncio)\b/.test(normalized)) {
    if ("speechSynthesis" in window) speechSynthesis.cancel();
    status("Voz interrompida");
    return;
  }

  if (/\b(ajuda|comandos disponíveis)\b/.test(normalized)) {
    localReply(
      "Posso conversar usando IA, dizer as horas e a data, pesquisar assuntos " +
      "e abrir YouTube, Google, Wikipédia, Spotify e WhatsApp Web."
    );
    return;
  }

  await askAI(text);
}

$("form").addEventListener("submit", event => {
  event.preventDefault();
  handleMessage(input.value);
});

input.addEventListener("input", () => {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 110) + "px";
});

input.addEventListener("keydown", event => {
  if (event.key === "Enter" && !event.shiftKey) {
    event.preventDefault();
    handleMessage(input.value);
  }
});

$("mic").addEventListener("click", () => {
  const SpeechRecognition =
    window.SpeechRecognition || window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    status("Microfone indisponível neste navegador");
    return;
  }

  if (recognition) {
    try { recognition.stop(); } catch (error) {}
  }

  recognition = new SpeechRecognition();
  recognition.lang = "pt-BR";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.onstart = () => status("Estou ouvindo...", "listening");
  recognition.onresult = event =>
    handleMessage(event.results[0][0].transcript);
  recognition.onerror = event =>
    status("Erro no microfone: " + event.error);
  recognition.onend = () => {
    if (app.classList.contains("listening")) status("Sistema pronto");
  };

  try {
    recognition.start();
  } catch (error) {
    status("Não consegui iniciar o microfone");
  }
});

$("newChat").addEventListener("click", () => {
  if (busy) return;
  if (!confirm("Apagar o histórico e iniciar uma nova conversa?")) return;

  if ("speechSynthesis" in window) speechSynthesis.cancel();

  chat.innerHTML = "";
  history = [];
  try { localStorage.removeItem("jarvis-history-v1"); } catch (error) {}

  const welcome = document.createElement("div");
  welcome.className = "welcome";
  welcome.id = "welcome";

  const symbol = document.createElement("div");
  symbol.style.cssText = "color:var(--gold);font-size:28px";
  symbol.textContent = "✧";

  const title = document.createElement("h2");
  title.textContent = "Nova conversa";

  const description = document.createElement("p");
  description.textContent = "Estou pronto. O que vamos descobrir hoje?";

  welcome.append(symbol, title, description);
  chat.appendChild(welcome);
  status("Nova conversa");
});

$("voiceToggle").addEventListener("click", () => {
  voiceEnabled = !voiceEnabled;
  $("voiceToggle").textContent =
    "Voz: " + (voiceEnabled ? "ligada" : "desligada");

  if (!voiceEnabled && "speechSynthesis" in window) {
    speechSynthesis.cancel();
  }
});

$("settingsToggle").addEventListener("click", () => {
  $("settings").classList.toggle("open");
});

document.querySelectorAll("[data-prompt]").forEach(button => {
  button.addEventListener("click", () => {
    handleMessage(button.dataset.prompt);
  });
});

/* Recupera as mensagens anteriores guardadas neste aparelho. */
try {
  const saved = JSON.parse(localStorage.getItem("jarvis-history-v1") || "[]");

  if (Array.isArray(saved) && saved.length) {
    $("welcome").remove();

    saved.slice(-80).forEach(item => {
      if (item && typeof item.content === "string") {
        const role = item.role === "user" ? "user" : "assistant";
        addMessage(role, item.content, false);
      }
    });

    history = saved.slice(-20).map(item => ({
      role: item.role === "user" ? "user" : "assistant",
      content: String(item.content || "")
    }));
  }
} catch (error) {}

})();
</script>
</body>
</html>
